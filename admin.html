<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yenə gəl — Restoran Admin Paneli</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #F7F6F2;
      --surface: #FFFFFF;
      --surface-soft: #F7F6F2;
      --border: #E5E2DC;
      --text-main: #181816;
      --text-muted: #786B59;
      --accent: #181816;
      --accent-text: #FFFFFF;
      --metallic: linear-gradient(155deg, #EFECE6 0%, #DDD6CA 52%, #F7F5F0 100%);
      --shadow: 0 10px 30px rgba(24, 24, 22, 0.05);
      --danger: #A33D32;
      --success: #3D6B4E;
    }

    body:not(.light-mode) {
      color-scheme: dark;
      --page-bg: #181816;
      --surface: #242320;
      --surface-soft: #302E2A;
      --border: #49453F;
      --text-main: #F7F5F0;
      --text-muted: #C0B6A8;
      --accent: #F7F5F0;
      --accent-text: #181816;
      --metallic: linear-gradient(155deg, #3B3832 0%, #292722 52%, #35322C 100%);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--page-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 56px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .top-brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-btn {
      flex: 0 0 auto;
      padding: 0 13px;
      height: 39px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .back-btn:hover {
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }

    .brand-pill {
      padding: 2px 0;
    }

    .brand-pill strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: -0.3px;
      text-transform: none;
      color: var(--text-main);
    }

    .brand-pill span {
      display: block;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .theme-switch {
      display: inline-flex;
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 3px;
      gap: 3px;
      box-shadow: 0 3px 12px rgba(24, 24, 22, 0.04);
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .theme-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.55;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 460px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input, .select, .textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--text-muted);
      box-shadow: 0 0 0 3px rgba(120, 107, 89, 0.1);
    }

    .textarea {
      min-height: 78px;
      resize: vertical;
    }

    .btn-primary {
      width: 100%;
      background: #181816;
      color: #ffffff;
      border: none;
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(24, 24, 22, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }

    body:not(.light-mode) .btn-primary {
      background: #F7F5F0;
      color: #181816;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 9px 20px rgba(24, 24, 22, 0.18);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      min-height: 20px;
    }

    .status-msg.err { color: var(--danger); }
    .status-msg.ok { color: var(--success); }
    .status-msg:empty { display: none; }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .slug-tag {
      display: inline-block;
      background: var(--metallic);
      color: var(--text-muted);
      border: 1px solid #D8D1C5;
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    body:not(.light-mode) .slug-tag {
      border-color: var(--border);
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--text-muted);
      outline-offset: 3px;
    }

    @media (max-width: 360px) {
      body { padding: 18px 12px 40px; }
      .card { padding: 17px; }
      .top-brand-group { gap: 7px; }
      .back-btn { padding: 0 10px; }
      .brand-pill strong { font-size: 14px; }
      .theme-btn { padding: 7px 9px; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body class="light-mode">
  <div class="app">
    <div class="top-bar">
      <div class="top-brand-group">
        <a id="backBtn" class="back-btn" href="index.html" aria-label="Ana səhifəyə qayıt" title="Geri">← Geri</a>
        <div class="brand-pill">
          <strong>Yenə gəl</strong>
          <span>Partner Admin</span>
        </div>
      </div>

      <div class="theme-switch" role="group" aria-label="Tema seçimi">
        <button id="lightThemeBtn" type="button" class="theme-btn active">Light</button>
        <button id="darkThemeBtn" type="button" class="theme-btn">Dark</button>
      </div>
    </div>

    <div id="loginCard" class="card">
      <div class="card-title">Restoran Panelinə Giriş</div>
      <div class="card-sub">Sizə verilmiş xüsusi restoran kodunu daxil edib çəntik sayını, kassir PİN-ini və bonus ayarlarını idarə edin.</div>

      <div class="field">
        <label for="slugInput">Restoran kodu (slug)</label>
        <input id="slugInput" class="input" type="text" placeholder="məs: kaya" autocomplete="off" />
      </div>

      <div class="field">
        <label for="accessCodeInput">Xüsusi giriş kodu</label>
        <input id="accessCodeInput" class="input" type="password" placeholder="Kodu daxil edin" autocomplete="off" />
      </div>

      <button id="loginBtn" type="button" class="btn-primary">Panelə daxil ol</button>
      <div id="loginMsg" class="status-msg err"></div>
    </div>

    <div id="settingsCard" class="card hidden">
      <div class="panel-head">
        <div>
          <div id="activeRestTitle" class="card-title">Restoran</div>
          <span id="activeSlugBadge" class="slug-tag">slug: -</span>
        </div>
        <button id="logoutBtn" type="button" class="btn-ghost">Çıxış</button>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="stampGoalInput">Çəntik sayı (hədəf)</label>
          <input id="stampGoalInput" class="input" type="number" min="1" max="20" step="1" />
        </div>

        <div class="field">
          <label for="cashierPinInput">Kassir PİN kodu (4 rəqəm)</label>
          <input id="cashierPinInput" class="input" type="text" inputmode="numeric" maxlength="4" placeholder="1234" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="bonusModeSelect">Bonus rejimi</label>
          <select id="bonusModeSelect" class="select">
            <option value="fixed">Sabit məbləğ (AZN)</option>
            <option value="percent">Faiz (%)</option>
          </select>
        </div>

        <div class="field">
          <label id="bonusValueLabel" for="bonusValueInput">Bonus məbləği (AZN)</label>
          <input id="bonusValueInput" class="input" type="number" step="0.01" min="0" />
        </div>
      </div>

      <div class="field">
        <label for="rewardTextInput">Bonus banner mətni</label>
        <input id="rewardTextInput" class="input" type="text" placeholder="məs: 10 AZN BONUS" />
      </div>

      <div class="field">
        <label for="restNameInput">Restoran adı</label>
        <input id="restNameInput" class="input" type="text" />
      </div>

      <div class="field">
        <label for="aboutInput">Restoran haqqında</label>
        <textarea id="aboutInput" class="textarea"></textarea>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="addressInput">Ünvan</label>
          <input id="addressInput" class="input" type="text" />
        </div>
        <div class="field">
          <label for="phoneInput">Əlaqə nömrəsi</label>
          <input id="phoneInput" class="input" type="text" />
        </div>
      </div>

      <div class="field">
        <label for="instagramInput">Instagram</label>
        <input id="instagramInput" class="input" type="text" placeholder="@restoran" />
      </div>

      <button id="saveBtn" type="button" class="btn-primary">Dəyişiklikləri yadda saxla</button>
      <div id="saveMsg" class="status-msg"></div>
    </div>
  </div>

  <script>
    (function () {
      const darkThemeBtn = document.getElementById('darkThemeBtn');
      const lightThemeBtn = document.getElementById('lightThemeBtn');

      function applyTheme(mode) {
        const isLight = mode !== 'dark';
        document.body.classList.toggle('light-mode', isLight);
        darkThemeBtn?.classList.toggle('active', !isLight);
        lightThemeBtn?.classList.toggle('active', isLight);
      }

      try { localStorage.removeItem('yenegel_theme_mode'); } catch {}
      applyTheme('light');
      darkThemeBtn?.addEventListener('click', () => applyTheme('dark'));
      lightThemeBtn?.addEventListener('click', () => applyTheme('light'));

      const params = new URLSearchParams(window.location.search);
      const backBtn = document.getElementById('backBtn');
      const slugInput = document.getElementById('slugInput');
      const accessCodeInput = document.getElementById('accessCodeInput');
      const loginBtn = document.getElementById('loginBtn');
      const loginMsg = document.getElementById('loginMsg');
      const loginCard = document.getElementById('loginCard');
      const settingsCard = document.getElementById('settingsCard');
      const logoutBtn = document.getElementById('logoutBtn');

      const activeRestTitle = document.getElementById('activeRestTitle');
      const activeSlugBadge = document.getElementById('activeSlugBadge');
      const stampGoalInput = document.getElementById('stampGoalInput');
      const cashierPinInput = document.getElementById('cashierPinInput');
      const bonusModeSelect = document.getElementById('bonusModeSelect');
      const bonusValueLabel = document.getElementById('bonusValueLabel');
      const bonusValueInput = document.getElementById('bonusValueInput');
      const rewardTextInput = document.getElementById('rewardTextInput');
      const restNameInput = document.getElementById('restNameInput');
      const aboutInput = document.getElementById('aboutInput');
      const addressInput = document.getElementById('addressInput');
      const phoneInput = document.getElementById('phoneInput');
      const instagramInput = document.getElementById('instagramInput');
      const saveBtn = document.getElementById('saveBtn');
      const saveMsg = document.getElementById('saveMsg');

      const initialSlug = (params.get('slug') || 'kaya').trim().toLowerCase();
      if (backBtn) {
        backBtn.href = `index.html?slug=${encodeURIComponent(initialSlug)}`;
      }

      if (params.get('slug') && slugInput) {
        slugInput.value = initialSlug;
      }

      let currentSession = { slug: '', accessCode: '' };

      function syncBonusLabel() {
        const isPercent = bonusModeSelect.value === 'percent';
        bonusValueLabel.textContent = isPercent ? 'Bonus faizi (%)' : 'Bonus məbləği (AZN)';
      }

      bonusModeSelect.addEventListener('change', syncBonusLabel);

      cashierPinInput.addEventListener('input', () => {
        cashierPinInput.value = cashierPinInput.value.replace(/\D/g, '').slice(0, 4);
      });

      function fillForm(r) {
        activeRestTitle.textContent = r.name || currentSession.slug;
        activeSlugBadge.textContent = `slug: ${currentSession.slug}`;
        stampGoalInput.value = r.stamp_goal ?? 5;
        cashierPinInput.value = r.pin_code ?? r.cashier_pin ?? '';
        bonusModeSelect.value = (r.bonus_mode || 'fixed').toLowerCase() === 'percent' ? 'percent' : 'fixed';
        syncBonusLabel();
        bonusValueInput.value = bonusModeSelect.value === 'percent'
          ? (r.bonus_percent ?? 10)
          : (r.bonus_fixed_amount ?? 10);
        rewardTextInput.value = r.reward_text ?? '';
        restNameInput.value = r.name ?? '';
        aboutInput.value = r.about ?? '';
        addressInput.value = r.address ?? '';
        phoneInput.value = r.phone ?? '';
        instagramInput.value = r.instagram ?? '';
      }

      async function handleLogin() {
        const slug = slugInput.value.trim().toLowerCase();
        const accessCode = accessCodeInput.value.trim();
        loginMsg.textContent = '';

        if (!slug || !accessCode) {
          loginMsg.textContent = 'Restoran kodunu və xüsusi giriş kodunu daxil edin.';
          return;
        }

        loginBtn.disabled = true;
        try {
          const res = await fetch('/.netlify/functions/admin-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ slug, accessCode })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            loginMsg.textContent = data.error || 'Kod və ya restoran adı yanlışdır.';
            return;
          }

          currentSession = { slug, accessCode };
          fillForm(data.restaurant || {});
          loginCard.classList.add('hidden');
          settingsCard.classList.remove('hidden');
        } catch {
          loginMsg.textContent = 'Serverlə əlaqə alınmadı.';
        } finally {
          loginBtn.disabled = false;
        }
      }

      async function handleSave() {
        saveMsg.textContent = '';
        saveMsg.className = 'status-msg';

        const stampGoal = Number(stampGoalInput.value);
        const cashierPin = cashierPinInput.value.trim();
        const bonusMode = bonusModeSelect.value;
        const bonusNum = Number(bonusValueInput.value);

        if (!Number.isInteger(stampGoal) || stampGoal < 1 || stampGoal > 20) {
          saveMsg.textContent = 'Çəntik sayı 1 ilə 20 arasında tam ədəd olmalıdır.';
          saveMsg.classList.add('err');
          return;
        }

        if (!/^\d{4}$/.test(cashierPin)) {
          saveMsg.textContent = 'Kassir PİN kodu tam 4 rəqəmdən ibarət olmalıdır.';
          saveMsg.classList.add('err');
          return;
        }

        if (!Number.isFinite(bonusNum) || bonusNum < 0) {
          saveMsg.textContent = 'Bonus dəyərini düzgün daxil edin.';
          saveMsg.classList.add('err');
          return;
        }

        saveBtn.disabled = true;
        try {
          const payload = {
            slug: currentSession.slug,
            accessCode: currentSession.accessCode,
            stamp_goal: stampGoal,
            cashier_pin: cashierPin,
            bonus_mode: bonusMode,
            bonus_fixed_amount: bonusMode === 'fixed' ? bonusNum : undefined,
            bonus_percent: bonusMode === 'percent' ? bonusNum : undefined,
            reward_text: rewardTextInput.value.trim(),
            name: restNameInput.value.trim(),
            about: aboutInput.value.trim(),
            address: addressInput.value.trim(),
            phone: phoneInput.value.trim(),
            instagram: instagramInput.value.trim()
          };

          const res = await fetch('/.netlify/functions/update-restaurant', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            saveMsg.textContent = data.error || 'Yadda saxlanılarkən xəta baş verdi.';
            saveMsg.classList.add('err');
            return;
          }

          if (data.restaurant) fillForm(data.restaurant);
          saveMsg.textContent = 'Ayarlar uğurla yeniləndi!';
          saveMsg.classList.add('ok');
        } catch {
          saveMsg.textContent = 'Şəbəkə xətası baş verdi.';
          saveMsg.classList.add('err');
        } finally {
          saveBtn.disabled = false;
        }
      }

      logoutBtn.addEventListener('click', () => {
        currentSession = { slug: '', accessCode: '' };
        accessCodeInput.value = '';
        saveMsg.textContent = '';
        settingsCard.classList.add('hidden');
        loginCard.classList.remove('hidden');
      });

      loginBtn.addEventListener('click', handleLogin);
      saveBtn.addEventListener('click', handleSave);
    })();
  </script>
</body>
</html>
