<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yenə gəl — Rəqəmsal Sadiqlik Kartı</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #F7F6F2;
      --surface: #FFFFFF;
      --surface-soft: #F7F6F2;
      --border: #E5E2DC;
      --text-main: #181816;
      --text-muted: #786B59;
      --accent: #181816;
      --accent-text: #FFFFFF;
      --metallic: linear-gradient(155deg, #EFECE6 0%, #DDD6CA 52%, #F7F5F0 100%);
      --shadow: 0 10px 30px rgba(24, 24, 22, 0.05);
      --danger: #A33D32;
      --success: #3D6B4E;
    }

    body:not(.light-mode) {
      color-scheme: dark;
      --page-bg: #181816;
      --surface: #242320;
      --surface-soft: #302E2A;
      --border: #49453F;
      --text-main: #F7F5F0;
      --text-muted: #C0B6A8;
      --accent: #F7F5F0;
      --accent-text: #181816;
      --metallic: linear-gradient(155deg, #3B3832 0%, #292722 52%, #35322C 100%);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--page-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 56px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 2px;
    }

    .brand-pill {
      padding: 2px 0;
    }

    .brand-pill strong {
      display: block;
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: -0.3px;
      text-transform: none;
      color: var(--text-main);
    }

    .brand-pill span {
      display: block;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .theme-switch {
      display: inline-flex;
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 3px;
      gap: 3px;
      box-shadow: 0 3px 12px rgba(24, 24, 22, 0.04);
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .theme-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .loyalty-card-top {
      background: var(--metallic);
      border: 1px solid #D8D1C5;
      border-radius: 17px;
      padding: 19px 16px 17px;
      margin-bottom: 17px;
    }

    body:not(.light-mode) .loyalty-card-top {
      border-color: var(--border);
    }

    .merchant-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      margin-bottom: 19px;
    }

    .rest-name {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.35px;
      overflow-wrap: break-word;
    }

    .reward-banner {
      flex: 0 1 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: fit-content;
      max-width: 65%;
      min-height: 27px;
      background: #181816;
      color: #FFFFFF;
      border: 1px solid #181816;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.85px;
      text-transform: uppercase;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: center;
      line-height: 1.25;
    }

    .stamps-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 11px;
      margin: 0 0 11px;
    }

    .stamp-slot {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: rgba(255, 255, 255, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-muted);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .stamp-slot.filled {
      border-style: solid;
      border-color: #181816;
      background: #181816;
      color: #ffffff;
      transform: scale(1.04);
    }

    body:not(.light-mode) .stamp-slot {
      background: rgba(255, 255, 255, 0.04);
    }

    body:not(.light-mode) .stamp-slot.filled {
      background: #F7F5F0;
      color: #181816;
      border-color: #F7F5F0;
    }

    .progress-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 650;
      margin-bottom: 0;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 15px;
    }

    .stat-box {
      min-width: 0;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px 10px;
      text-align: left;
    }

    .stat-box small {
      display: block;
      font-size: 10px;
      font-weight: 650;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .stat-box strong {
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .btn-primary {
      width: 100%;
      background: #181816;
      color: #ffffff;
      border: none;
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(24, 24, 22, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }

    body:not(.light-mode) .btn-primary {
      background: #F7F5F0;
      color: #181816;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 9px 20px rgba(24, 24, 22, 0.18);
    }

    .btn-secondary {
      width: 100%;
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-redeem {
      background: #047857;
      color: #FFFFFF;
      border: 1px solid #047857;
      box-shadow: 0 6px 16px rgba(4, 120, 87, 0.24);
    }

    .btn-redeem:hover:not(:disabled) {
      background: #065F46;
      border-color: #065F46;
    }

    body:not(.light-mode) .btn-redeem {
      background: #34D399;
      color: #052E23;
      border-color: #34D399;
      box-shadow: 0 6px 16px rgba(52, 211, 153, 0.2);
    }

    body:not(.light-mode) .btn-redeem:hover:not(:disabled) {
      background: #6EE7B7;
      border-color: #6EE7B7;
    }

    .btn-danger-ghost {
      width: 100%;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(24, 24, 22, 0.58);
      backdrop-filter: blur(6px);
    }

    .modal-box {
      width: min(100%, 420px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
      animation: modal-enter 0.18s ease-out;
    }

    @keyframes modal-enter {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    body.modal-open {
      overflow: hidden;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .input:focus {
      border-color: var(--text-muted);
    }

    .msg {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      min-height: 18px;
    }

    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--success); }

    .about-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 19px;
      box-shadow: var(--shadow);
    }

    .about-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 9px;
    }

    .about-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 13px;
    }

    .about-meta {
      font-size: 12px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .about-meta div {
      overflow-wrap: anywhere;
    }

    .admin-footer-wrap {
      width: 100%;
      margin-top: 0;
      display: flex;
      justify-content: center;
    }

    .admin-panel-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: none;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .admin-panel-btn:hover {
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }

    .admin-panel-btn::after {
      content: " ↗";
      margin-left: 3px;
    }

    .msg:empty {
      display: none;
    }

    @media (max-width: 360px) {
      body { padding: 18px 12px 40px; }
      .card { padding: 10px; }
      .loyalty-card-top { padding: 17px 12px 15px; }
      .merchant-heading { align-items: flex-start; }
      .rest-name { font-size: 16px; }
      .stamps-grid { gap: 8px; }
      .stamp-slot { width: 42px; height: 42px; }
      .stat-box { padding: 11px 8px; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body class="light-mode">
  <div class="app">
    <div class="top-bar">
      <div class="brand-pill">
        <strong>Yenə gəl</strong>
        <span>SADİQLİK KARTI</span>
      </div>

      <div class="theme-switch" role="group" aria-label="Tema seçimi">
        <button id="lightThemeBtn" type="button" class="theme-btn active">Light</button>
        <button id="darkThemeBtn" type="button" class="theme-btn">Dark</button>
      </div>
    </div>

    <div class="card">
      <div class="loyalty-card-top">
        <div class="merchant-heading">
          <div id="restName" class="rest-name">Yüklənir...</div>
          <div id="rewardBanner" class="reward-banner">BONUS</div>
        </div>
        <div id="stampsGrid" class="stamps-grid"></div>
        <div id="progressText" class="progress-text">0 / 5 möhür</div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <small>Toplam hesab</small>
          <strong id="totalSpentText">0.00 AZN</strong>
        </div>
        <div class="stat-box">
          <small>Cari bonus</small>
          <strong id="bonusBalanceText">0.00 AZN</strong>
        </div>
      </div>

      <div class="actions">
        <button id="openStampBtn" type="button" class="btn-primary">Möhür əlavə et (Kassir)</button>
        <button id="redeemBtn" type="button" class="btn-secondary btn-redeem hidden">Bonusu istifadə et</button>
        <button id="undoBtn" type="button" class="btn-danger-ghost">Son möhürü geri al</button>
      </div>

      <div id="mainMsg" class="msg"></div>
    </div>

    <div id="cashierPanel" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="cashierTitle">
      <div class="modal-box">
        <div id="cashierTitle" class="modal-title">Kassir Təsdiqi</div>
        <div id="amountFieldWrap" class="field">
          <label for="billAmountInput">Hesab məbləği (AZN)</label>
          <input id="billAmountInput" class="input" type="text" inputmode="decimal" pattern="[0-9]+([.,][0-9]{1,2})?" autocomplete="off" placeholder="məs: 25,00" />
        </div>
        <div class="field">
          <label for="pinInput">Kassir PİN kodu (4 rəqəm)</label>
          <input id="pinInput" class="input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="••••" />
        </div>
        <div class="actions">
          <button id="confirmCashierBtn" type="button" class="btn-primary">Təsdiqlə</button>
          <button id="cancelCashierBtn" type="button" class="btn-danger-ghost">Bağla</button>
        </div>
        <div id="cashierMsg" class="msg err"></div>
      </div>
    </div>

    <div id="aboutBox" class="about-card">
      <div class="about-title">Məkan haqqında</div>
      <div id="aboutText" class="about-desc"></div>
      <div id="aboutMeta" class="about-meta"></div>
    </div>

    <div class="admin-footer-wrap">
      <a id="adminPanelBtn" class="admin-panel-btn" href="/admin.html?slug=kaya">Partner Admin Paneli</a>
    </div>
  </div>

  <script>
    (function () {
      const darkThemeBtn = document.getElementById('darkThemeBtn');
      const lightThemeBtn = document.getElementById('lightThemeBtn');

      function applyTheme(mode) {
        const isLight = mode !== 'dark';
        document.body.classList.toggle('light-mode', isLight);
        darkThemeBtn?.classList.toggle('active', !isLight);
        lightThemeBtn?.classList.toggle('active', isLight);
      }

      try { localStorage.removeItem('yenegel_theme_mode'); } catch {}
      applyTheme('light');
      darkThemeBtn?.addEventListener('click', () => applyTheme('dark'));
      lightThemeBtn?.addEventListener('click', () => applyTheme('light'));

      const params = new URLSearchParams(window.location.search);
      const slug = (params.get('slug') || 'kaya').trim().toLowerCase();

      const adminPanelBtn = document.getElementById('adminPanelBtn');
      if (adminPanelBtn) {
        adminPanelBtn.href = `/admin.html?slug=${encodeURIComponent(slug)}`;
      }

      const tokenKey = `yenegel_visitor_${slug}`;
      let visitorToken = '';
      try {
        visitorToken = localStorage.getItem(tokenKey) || '';
        if (!visitorToken) {
          visitorToken = 'v_' + Math.random().toString(36).slice(2) + '_' + Date.now().toString(36);
          localStorage.setItem(tokenKey, visitorToken);
        }
      } catch {
        visitorToken = 'v_temp_' + slug;
      }

      const restNameEl = document.getElementById('restName');
      const rewardBannerEl = document.getElementById('rewardBanner');
      const stampsGridEl = document.getElementById('stampsGrid');
      const progressTextEl = document.getElementById('progressText');
      const totalSpentTextEl = document.getElementById('totalSpentText');
      const bonusBalanceTextEl = document.getElementById('bonusBalanceText');
      const openStampBtn = document.getElementById('openStampBtn');
      const redeemBtn = document.getElementById('redeemBtn');
      const undoBtn = document.getElementById('undoBtn');
      const mainMsgEl = document.getElementById('mainMsg');

      const cashierPanel = document.getElementById('cashierPanel');
      const cashierTitle = document.getElementById('cashierTitle');
      const amountFieldWrap = document.getElementById('amountFieldWrap');
      const billAmountInput = document.getElementById('billAmountInput');
      const pinInput = document.getElementById('pinInput');
      const confirmCashierBtn = document.getElementById('confirmCashierBtn');
      const cancelCashierBtn = document.getElementById('cancelCashierBtn');
      const cashierMsgEl = document.getElementById('cashierMsg');

      const aboutTextEl = document.getElementById('aboutText');
      const aboutMetaEl = document.getElementById('aboutMeta');

      billAmountInput.addEventListener('input', () => {
        let value = billAmountInput.value.replace(/,/g, '.').replace(/[^\d.]/g, '');
        const decimalIndex = value.indexOf('.');
        if (decimalIndex !== -1) {
          value = value.slice(0, decimalIndex + 1) + value.slice(decimalIndex + 1).replace(/\./g, '').slice(0, 2);
        }
        billAmountInput.value = value;
      });

      const allowedPinKeys = ['Backspace', 'Delete', 'Tab', 'Enter', 'Escape', 'ArrowLeft', 'ArrowRight', 'Home', 'End'];
      pinInput.addEventListener('keydown', event => {
        if (event.ctrlKey || event.metaKey || allowedPinKeys.includes(event.key)) return;
        if (!/^\d$/.test(event.key)) event.preventDefault();
      });
      pinInput.addEventListener('input', () => {
        pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
      });
      pinInput.addEventListener('paste', event => {
        event.preventDefault();
        const pastedText = event.clipboardData?.getData('text') || '';
        const start = pinInput.selectionStart ?? pinInput.value.length;
        const end = pinInput.selectionEnd ?? start;
        pinInput.setRangeText(pastedText, start, end, 'end');
        pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
      });

      let currentAction = 'stamp';
      let stateRestaurant = null;
      let stateCard = null;

      function renderUI() {
        const r = stateRestaurant || {};
        const c = stateCard || { stamps_count: 0, reward_unlocked: false, total_spent: 0, bonus_balance: 0 };

        restNameEl.textContent = r.name || slug;
        rewardBannerEl.textContent = (r.reward_text || 'BONUS').replace(/\bVIP\s+/gi, '');

        const configuredGoal = Number(r.stamp_goal);
        const goal = Number.isInteger(configuredGoal) && configuredGoal > 0 ? configuredGoal : 5;
        const storedStamps = Number(c.stamps_count);
        const stamps = Number.isFinite(storedStamps) ? Math.max(0, Math.floor(storedStamps)) : 0;
        const shouldUnlock = stamps >= goal;

        stampsGridEl.innerHTML = '';
        for (let i = 1; i <= goal; i++) {
          const slot = document.createElement('div');
          slot.className = 'stamp-slot' + (i <= stamps ? ' filled' : '');
          slot.textContent = i <= stamps ? '✓' : String(i);
          stampsGridEl.appendChild(slot);
        }

        progressTextEl.textContent = `${Math.min(stamps, goal)} / ${goal} möhür`;
        totalSpentTextEl.textContent = `${Number(c.total_spent || 0).toFixed(2)} AZN`;
        bonusBalanceTextEl.textContent = `${Number(c.bonus_balance || 0).toFixed(2)} AZN`;

        redeemBtn.classList.toggle('hidden', !shouldUnlock);

        aboutTextEl.textContent = r.about || '';
        const metaLines = [];
        if (r.address) metaLines.push(`Ünvan: ${r.address}`);
        if (r.phone) metaLines.push(`Əlaqə: ${r.phone}`);
        if (r.instagram) metaLines.push(`Instagram: ${r.instagram}`);
        aboutMetaEl.textContent = '';
        metaLines.forEach(line => {
          const lineEl = document.createElement('div');
          lineEl.textContent = line;
          aboutMetaEl.appendChild(lineEl);
        });
      }

      async function loadCard() {
        try {
          const res = await fetch(`/.netlify/functions/get-card?slug=${encodeURIComponent(slug)}&visitorToken=${encodeURIComponent(visitorToken)}`);
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.restaurant || !data.card) {
            mainMsgEl.textContent = data.error || 'Məlumat yüklənmədi.';
            mainMsgEl.className = 'msg err';
            return false;
          }
          stateRestaurant = data.restaurant;
          stateCard = data.card;
          renderUI();
          return true;
        } catch {
          mainMsgEl.textContent = 'Serverlə əlaqə alınmadı.';
          mainMsgEl.className = 'msg err';
          return false;
        }
      }

      function openCashier(action) {
        currentAction = action;
        cashierMsgEl.textContent = '';
        pinInput.value = '';
        billAmountInput.value = '';
        amountFieldWrap.classList.toggle('hidden', action !== 'stamp');

        if (action === 'stamp') cashierTitle.textContent = 'Möhür Əlavə Et (Kassir)';
        else if (action === 'redeem') cashierTitle.textContent = 'Bonusu İstifadə Et (Kassir)';
        else cashierTitle.textContent = 'Son Möhürü Geri Al (Kassir)';

        cashierPanel.classList.remove('hidden');
        document.body.classList.add('modal-open');
        (action === 'stamp' ? billAmountInput : pinInput).focus();
      }

      function closeCashier() {
        cashierPanel.classList.add('hidden');
        document.body.classList.remove('modal-open');
        cashierMsgEl.textContent = '';
        const trigger = currentAction === 'redeem' ? redeemBtn : currentAction === 'undo' ? undoBtn : openStampBtn;
        trigger.focus();
      }

      async function handleCashierConfirm() {
        cashierMsgEl.textContent = '';
        mainMsgEl.textContent = '';

        const pin = pinInput.value.trim();
        if (!/^\d{4}$/.test(pin)) {
          cashierMsgEl.textContent = 'PİN kod tam 4 rəqəm olmalıdır.';
          return;
        }

        let endpoint = '/.netlify/functions/add-stamp';
        const payload = { slug, visitorToken, pin };

        if (currentAction === 'stamp') {
          const amount = Number(billAmountInput.value.replace(',', '.'));
          if (!Number.isFinite(amount) || amount <= 0) {
            cashierMsgEl.textContent = 'Düzgün hesab məbləği daxil edin.';
            return;
          }
          payload.amount = amount;
          endpoint = '/.netlify/functions/add-stamp';
        } else if (currentAction === 'redeem') {
          endpoint = '/.netlify/functions/redeem-bonus';
        } else if (currentAction === 'undo') {
          endpoint = '/.netlify/functions/undo-stamp';
        }

        confirmCashierBtn.disabled = true;
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            cashierMsgEl.textContent = data.error || 'Əməliyyat alınmadı.';
            return;
          }

          closeCashier();
          if (await loadCard()) {
            mainMsgEl.textContent = data.message || 'Əməliyyat uğurla tamamlandı!';
            mainMsgEl.className = 'msg ok';
          } else {
            mainMsgEl.textContent = 'Əməliyyat tamamlandı, lakin kart yenilənmədi. Səhifəni yeniləyin.';
            mainMsgEl.className = 'msg err';
          }
        } catch {
          cashierMsgEl.textContent = 'Şəbəkə xətası baş verdi.';
        } finally {
          confirmCashierBtn.disabled = false;
        }
      }

      openStampBtn.addEventListener('click', () => openCashier('stamp'));
      redeemBtn.addEventListener('click', () => openCashier('redeem'));
      undoBtn.addEventListener('click', () => openCashier('undo'));
      cancelCashierBtn.addEventListener('click', closeCashier);
      confirmCashierBtn.addEventListener('click', handleCashierConfirm);
      cashierPanel.addEventListener('click', event => {
        if (event.target === cashierPanel) closeCashier();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !cashierPanel.classList.contains('hidden')) {
          closeCashier();
        }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') loadCard();
      });

      loadCard();
    })();
  </script>
</body>
</html>
