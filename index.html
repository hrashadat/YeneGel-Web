<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yenə gəl — Rəqəmsal Sadiqlik Kartı</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #F7F6F2;
      --surface: #FFFFFF;
      --surface-soft: #F7F6F2;
      --border: #E5E2DC;
      --text-main: #181816;
      --text-muted: #786B59;
      --accent: #181816;
      --accent-text: #FFFFFF;
      --metallic: linear-gradient(155deg, #EFECE6 0%, #DDD6CA 52%, #F7F5F0 100%);
      --shadow: 0 10px 30px rgba(24, 24, 22, 0.05);
      --danger: #A33D32;
      --success: #3D6B4E;
    }

    body:not(.light-mode) {
      color-scheme: dark;
      --page-bg: #181816;
      --surface: #242320;
      --surface-soft: #302E2A;
      --border: #49453F;
      --text-main: #F7F5F0;
      --text-muted: #C0B6A8;
      --accent: #F7F5F0;
      --accent-text: #181816;
      --metallic: linear-gradient(155deg, #3B3832 0%, #292722 52%, #35322C 100%);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--page-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 56px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 2px;
    }

    .brand-pill {
      padding: 2px 0;
    }

    .brand-pill strong {
      display: block;
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: -0.3px;
      text-transform: none;
      color: var(--text-main);
    }

    .brand-pill span {
      display: block;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .theme-switch {
      display: inline-flex;
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 3px;
      gap: 3px;
      box-shadow: 0 3px 12px rgba(24, 24, 22, 0.04);
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .theme-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .loyalty-card-top {
      background: var(--metallic);
      border: 1px solid #D8D1C5;
      border-radius: 17px;
      padding: 19px 16px 17px;
      margin-bottom: 17px;
    }

    body:not(.light-mode) .loyalty-card-top {
      border-color: var(--border);
    }

    .merchant-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      margin-bottom: 19px;
    }

    .rest-name {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.35px;
      overflow-wrap: break-word;
    }

    .reward-banner {
      flex: 0 1 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: fit-content;
      max-width: 65%;
      min-height: 27px;
      background: #181816;
      color: #FFFFFF;
      border: 1px solid #181816;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.85px;
      text-transform: uppercase;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: center;
      line-height: 1.25;
    }

    .stamps-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 11px;
      margin: 0 0 11px;
    }

    .stamp-slot {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: rgba(255, 255, 255, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-muted);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .stamp-slot.filled {
      border-style: solid;
      border-color: #181816;
      background: #181816;
      color: #ffffff;
      transform: scale(1.04);
    }

    body:not(.light-mode) .stamp-slot {
      background: rgba(255, 255, 255, 0.04);
    }

    body:not(.light-mode) .stamp-slot.filled {
      background: #F7F5F0;
      color: #181816;
      border-color: #F7F5F0;
    }

    .progress-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 650;
      margin-bottom: 0;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 15px;
    }

    .stat-box {
      min-width: 0;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px 10px;
      text-align: left;
    }

    .stat-box small {
      display: block;
      font-size: 10px;
      font-weight: 650;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .stat-box strong {
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .btn-primary {
      width: 100%;
      background: #181816;
      color: #ffffff;
      border: none;
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(24, 24, 22, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }

    body:not(.light-mode) .btn-primary {
      background: #F7F5F0;
      color: #181816;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 9px 20px rgba(24, 24, 22, 0.18);
    }

    .btn-secondary {
      width: 100%;
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-redeem {
      background: #047857;
      color: #FFFFFF;
      border: 1px solid #047857;
      box-shadow: 0 6px 16px rgba(4, 120, 87, 0.24);
    }

    .btn-redeem:hover:not(:disabled) {
      background: #065F46;
      border-color: #065F46;
    }

    body:not(.light-mode) .btn-redeem {
      background: #34D399;
      color: #052E23;
      border-color: #34D399;
      box-shadow: 0 6px 16px rgba(52, 211, 153, 0.2);
    }

    body:not(.light-mode) .btn-redeem:hover:not(:disabled) {
      background: #6EE7B7;
      border-color: #6EE7B7;
    }

    .btn-danger-ghost {
      width: 100%;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(24, 24, 22, 0.58);
      backdrop-filter: blur(6px);
    }

    .modal-box {
      width: min(100%, 420px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
      animation: modal-enter 0.18s ease-out;
    }

    @keyframes modal-enter {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    body.modal-open {
      overflow: hidden;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .input:focus {
      border-color: var(--text-muted);
    }

    .msg {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      min-height: 18px;
    }

    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--success); }

    .about-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 19px;
      box-shadow: var(--shadow);
    }

    .about-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 9px;
    }

    .about-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 13px;
    }

    .about-meta {
      font-size: 12px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .about-meta div {
      overflow-wrap: anywhere;
    }

    .admin-footer-wrap {
      width: 100%;
      margin-top: 0;
      display: flex;
      justify-content: center;
    }

    .admin-panel-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: none;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .admin-panel-btn:hover {
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }

    .admin-panel-btn::after {
      content: " ↗";
      margin-left: 3px;
    }

    .msg:empty {
      display: none;
    }

    @media (max-width: 360px) {
      body { padding: 18px 12px 40px; }
      .card { padding: 10px; }
      .loyalty-card-top { padding: 17px 12px 15px; }
      .merchant-heading { align-items: flex-start; }
      .rest-name { font-size: 16px; }
      .stamps-grid { gap: 8px; }
      .stamp-slot { width: 42px; height: 42px; }
      .stat-box { padding: 11px 8px; }
    }

    .auth-modes { width: 100%; margin-bottom: 18px; }
    .auth-mode-btn { flex: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="light-mode">
  <div class="app">
    <div class="top-bar">
      <div class="brand-pill">
        <strong>Yenə gəl</strong>
        <span>MÜŞTƏRİ KARTI</span>
      </div>
      <div class="theme-switch" role="group" aria-label="Tema seçimi">
        <button id="lightThemeBtn" type="button" class="theme-btn active">Light</button>
        <button id="darkThemeBtn" type="button" class="theme-btn">Dark</button>
      </div>
    </div>

    <section id="authCard" class="card">
      <div class="about-title">Müştəri hesabı</div>
      <p class="about-desc">Davam etmək üçün giriş edin və ya yeni hesab yaradın.</p>
      <div class="theme-switch auth-modes" role="tablist" aria-label="Giriş və qeydiyyat">
        <button id="loginModeBtn" type="button" class="theme-btn auth-mode-btn">Giriş</button>
        <button id="registerModeBtn" type="button" class="theme-btn auth-mode-btn active">Qeydiyyat</button>
      </div>
      <form id="loginForm" class="hidden">
        <div class="field">
          <label for="loginPhoneInput">Telefon nömrəsi</label>
          <input id="loginPhoneInput" class="input" type="tel" inputmode="tel" autocomplete="tel" placeholder="+994..." required />
        </div>
        <button id="loginBtn" type="submit" class="btn-primary">Giriş et</button>
      </form>
      <form id="registrationForm">
        <div class="field">
          <label for="firstNameInput">Ad</label>
          <input id="firstNameInput" class="input" type="text" maxlength="80" autocomplete="given-name" required />
        </div>
        <div class="field">
          <label for="lastNameInput">Soyad</label>
          <input id="lastNameInput" class="input" type="text" maxlength="80" autocomplete="family-name" required />
        </div>
        <div class="field">
          <label for="phoneInput">Telefon nömrəsi</label>
          <input id="phoneInput" class="input" type="tel" inputmode="tel" autocomplete="tel" placeholder="+994..." required />
        </div>
        <button id="registerBtn" type="submit" class="btn-primary">Qeydiyyatdan keç</button>
      </form>
      <div id="authMsg" class="msg" role="status"></div>
    </section>

    <main id="customerCard" class="card hidden">
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
        <button id="logoutBtn" type="button" class="btn-secondary">Çıxış et</button>
      </div>
      <div class="loyalty-card-top">
        <div class="merchant-heading">
          <div id="restName" class="rest-name">Yüklənir...</div>
          <div id="rewardBanner" class="reward-banner">BONUS</div>
        </div>
        <div id="stampsGrid" class="stamps-grid"></div>
        <div id="progressText" class="progress-text">0 / 5 möhür</div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <small>Toplam hesab</small>
          <strong id="totalSpentText">0.00 AZN</strong>
        </div>
        <div class="stat-box">
          <small>Cari bonus</small>
          <strong id="bonusBalanceText">0.00 AZN</strong>
        </div>
      </div>
      <div class="about-card" style="box-shadow:none;padding:14px 0 0;border:0;text-align:center">
        <div class="about-title">Şəxsi QR kodunuz</div>
        <div id="customerName" class="about-desc"></div>
        <div id="customerQr" style="display:inline-block;background:#fff;padding:10px;border-radius:12px;min-width:180px;min-height:180px"></div>
        <div id="customerId" class="about-desc" style="margin-top:8px;overflow-wrap:anywhere"></div>
      </div>
      <div id="mainMsg" class="msg" role="status"></div>
    </main>

    <section id="aboutBox" class="about-card hidden">
      <div class="about-title">Məkan haqqında</div>
      <div id="aboutText" class="about-desc"></div>
      <div id="aboutMeta" class="about-meta"></div>
    </section>
    <div class="admin-footer-wrap">
      <a id="cashierLink" class="admin-panel-btn" href="/kassir.html">Kassir / Admin paneli</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const slug = (params.get('slug') || 'kaya').trim().toLowerCase();
      const localKey = `yenegel_customer_${slug}`;
      const authCard = document.getElementById('authCard');
      const customerCard = document.getElementById('customerCard');
      const loginForm = document.getElementById('loginForm');
      const registrationForm = document.getElementById('registrationForm');
      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      const authMsg = document.getElementById('authMsg');
      const mainMsg = document.getElementById('mainMsg');
      const customerQr = document.getElementById('customerQr');
      let customer = null;

      const applyTheme = mode => {
        const isLight = mode !== 'dark';
        document.body.classList.toggle('light-mode', isLight);
        document.getElementById('darkThemeBtn').classList.toggle('active', !isLight);
        document.getElementById('lightThemeBtn').classList.toggle('active', isLight);
      };
      document.getElementById('darkThemeBtn').addEventListener('click', () => applyTheme('dark'));
      document.getElementById('lightThemeBtn').addEventListener('click', () => applyTheme('light'));
      document.getElementById('cashierLink').href = `/kassir.html?slug=${encodeURIComponent(slug)}`;

      function showMessage(element, message, isError) {
        element.textContent = message;
        element.className = `msg ${isError ? 'err' : 'ok'}`;
      }

      function setAuthMode(mode) {
        const isLogin = mode === 'login';
        loginForm.classList.toggle('hidden', !isLogin);
        registrationForm.classList.toggle('hidden', isLogin);
        document.getElementById('loginModeBtn').classList.toggle('active', isLogin);
        document.getElementById('registerModeBtn').classList.toggle('active', !isLogin);
        authMsg.textContent = '';
      }

      document.getElementById('loginModeBtn').addEventListener('click', () => setAuthMode('login'));
      document.getElementById('registerModeBtn').addEventListener('click', () => setAuthMode('register'));

      function renderCard(restaurant, card) {
        document.getElementById('restName').textContent = restaurant.name || slug;
        document.getElementById('rewardBanner').textContent = (restaurant.reward_text || 'BONUS').replace(/\bVIP\s+/gi, '');
        const configuredGoal = Number(restaurant.stamp_goal);
        const goal = Number.isInteger(configuredGoal) && configuredGoal > 0 ? configuredGoal : 5;
        const stampsValue = Number(card.stamps_count);
        const stamps = Number.isFinite(stampsValue) ? Math.max(0, Math.floor(stampsValue)) : 0;
        const grid = document.getElementById('stampsGrid');
        grid.replaceChildren();
        for (let index = 1; index <= goal; index += 1) {
          const slot = document.createElement('div');
          slot.className = `stamp-slot${index <= stamps ? ' filled' : ''}`;
          slot.textContent = index <= stamps ? '✓' : String(index);
          grid.appendChild(slot);
        }
        document.getElementById('progressText').textContent = `${Math.min(stamps, goal)} / ${goal} möhür`;
        document.getElementById('totalSpentText').textContent = `${Number(card.total_spent || 0).toFixed(2)} AZN`;
        document.getElementById('bonusBalanceText').textContent = `${Number(card.bonus_balance || 0).toFixed(2)} AZN`;

        document.getElementById('customerName').textContent = `${customer.first_name} ${customer.last_name}`;
        document.getElementById('customerId').textContent = `Müştəri ID: ${customer.id}`;
        customerQr.replaceChildren();
        if (typeof QRCode !== 'function') {
          showMessage(mainMsg, 'QR kod kitabxanası yüklənmədi. İnternet bağlantısını yoxlayın.', true);
        } else {
          new QRCode(customerQr, { text: customer.id, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
        }

        document.getElementById('aboutText').textContent = restaurant.about || '';
        const meta = document.getElementById('aboutMeta');
        meta.replaceChildren();
        [['Ünvan', restaurant.address], ['Əlaqə', restaurant.phone], ['Instagram', restaurant.instagram]]
          .filter(([, value]) => value)
          .forEach(([label, value]) => {
            const line = document.createElement('div');
            line.textContent = `${label}: ${value}`;
            meta.appendChild(line);
          });
        authCard.classList.add('hidden');
        customerCard.classList.remove('hidden');
        document.getElementById('aboutBox').classList.remove('hidden');
      }

      function getLegacyVisitorToken() {
        try {
          return localStorage.getItem(`yenegel_visitor_${slug}`) || '';
        } catch {
          return '';
        }
      }

      async function loadCustomerCard() {
        const response = await fetch(
          `/.netlify/functions/get-card?slug=${encodeURIComponent(slug)}&visitorToken=${encodeURIComponent(customer.id)}`
        );
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.restaurant || !data.card) {
          throw new Error(data.error || 'Müştəri kartı yüklənmədi.');
        }
        renderCard(data.restaurant, data.card);
      }

      async function completeAuthentication(profile) {
        if (!profile || !profile.id) throw new Error('Müştəri məlumatı cavabda tapılmadı.');
        customer = {
          id: profile.id,
          first_name: profile.first_name,
          last_name: profile.last_name,
          phone: profile.phone
        };
        localStorage.setItem(localKey, JSON.stringify(customer));
        await loadCustomerCard();
      }

      loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        authMsg.textContent = '';
        loginBtn.disabled = true;
        try {
          const response = await fetch('/.netlify/functions/customer-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slug,
              phone: document.getElementById('loginPhoneInput').value.trim(),
              legacy_visitor_token: getLegacyVisitorToken()
            })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.customer) throw new Error(data.error || 'Giriş alınmadı.');
          await completeAuthentication(data.customer);
        } catch (error) {
          showMessage(authMsg, error.message || 'Serverlə əlaqə alınmadı.', true);
        } finally {
          loginBtn.disabled = false;
        }
      });

      registrationForm.addEventListener('submit', async event => {
        event.preventDefault();
        authMsg.textContent = '';
        registerBtn.disabled = true;
        try {
          const response = await fetch('/.netlify/functions/customer-register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slug,
              first_name: document.getElementById('firstNameInput').value.trim(),
              last_name: document.getElementById('lastNameInput').value.trim(),
              phone: document.getElementById('phoneInput').value.trim(),
              legacy_visitor_token: getLegacyVisitorToken()
            })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.customer) throw new Error(data.error || 'Qeydiyyat tamamlanmadı.');
          await completeAuthentication(data.customer);
        } catch (error) {
          showMessage(authMsg, error.message || 'Serverlə əlaqə alınmadı.', true);
        } finally {
          registerBtn.disabled = false;
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        try {
          localStorage.removeItem(localKey);
        } catch {
          showMessage(mainMsg, 'Çıxış məlumatını bu cihazdan silmək mümkün olmadı.', true);
          return;
        }
        customer = null;
        customerCard.classList.add('hidden');
        authCard.classList.remove('hidden');
        document.getElementById('aboutBox').classList.add('hidden');
        loginForm.reset();
        registrationForm.reset();
        customerQr.replaceChildren();
        setAuthMode('login');
      });

      try {
        const stored = localStorage.getItem(localKey);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(parsed.id)) {
            customer = parsed;
            loadCustomerCard().catch(error => showMessage(authMsg, error.message, true));
          } else {
            localStorage.removeItem(localKey);
          }
        }
      } catch (error) {
        showMessage(authMsg, 'Bu cihazda müştəri məlumatını oxumaq mümkün olmadı.', true);
      }
    })();
  </script>
</body>
</html>
