<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAYA — Bonus və Menyu</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --ink: #181818;
      --muted: #666666;
      --accent: #1f5c3b;
      --gold-bg: #fff6df;
      --gold-border: #e6c273;
      --gold-ink: #9c6508;
      --line: #e4dfd5;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 20px 14px 40px;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo-box {
      display: inline-block;
      padding: 8px 28px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 4px 0 var(--ink);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      margin-bottom: 14px;
    }

    .circles {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .circle {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px dashed #b9b3a6;
      background: #faf9f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: var(--muted);
      transition: 0.2s ease;
    }

    .circle.done {
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 10px rgba(31, 92, 59, 0.25);
    }

    .bonus-pill {
      text-align: center;
      padding: 12px 14px;
      border-radius: 999px;
      background: var(--gold-bg);
      border: 1.5px solid var(--gold-border);
      color: var(--gold-ink);
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .bonus-pill.ready {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      min-height: 18px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-dark { background: var(--ink); color: #fff; }
    .btn-green { background: var(--accent); color: #fff; }
    .btn-gray { background: #ece9e1; color: var(--ink); }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 14px;
      padding: 13px 10px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .box-title {
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .box-text {
      font-size: 14px;
      line-height: 1.55;
      color: #333;
    }

    .menu-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid #efece6;
    }

    .menu-row:last-child { border-bottom: none; padding-bottom: 0; }
    .menu-name { font-weight: 700; font-size: 14px; }
    .menu-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .menu-price { font-weight: 800; font-size: 14px; white-space: nowrap; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99;
    }

    .modal.open { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 350px;
      background: var(--card);
      border-radius: 20px;
      padding: 20px 16px;
    }

    .modal-title { font-size: 17px; font-weight: 900; text-align: center; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 14px; }

    .pin-input {
      width: 100%;
      padding: 12px;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 10px;
      border: 2px solid var(--line);
      border-radius: 14px;
      margin-bottom: 10px;
    }

    .msg {
      min-height: 20px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }

    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--accent); }

    .modal-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="logo-wrap">
      <div class="logo-box" id="restName">KAYA</div>
    </div>

    <div class="card">
      <div class="circles" id="circles"></div>
      <div class="bonus-pill" id="bonusPill">10 MANAT BONUS</div>
      <div class="hint" id="hintText">0 / 5 dairə dolub</div>
      <button class="btn btn-dark" id="actionBtn" type="button">Xal əlavə et</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="about" type="button">Restoran haqqında</button>
      <button class="tab" data-tab="menu" type="button">Menu</button>
    </div>

    <div class="card" id="aboutBox">
      <div class="box-title">Restoran haqqında</div>
      <div class="box-text" id="aboutText">
        KAYA — dadlı yeməklər, isti atmosfer və daimi qonaqlarımız üçün bonus sistemi.
      </div>
    </div>

    <div class="card" id="menuBox" style="display: none;">
      <div class="box-title">Menu</div>
      <div id="menuList"></div>
    </div>
  </div>

  <div class="modal" id="pinModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Kassir PİN kodu</div>
      <div class="modal-sub" id="modalSub">Xal əlavə etmək üçün PİN kodu daxil edin</div>
      <input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••" />
      <div class="msg" id="modalMsg"></div>
      <div class="modal-btns">
        <button class="btn btn-gray" id="cancelBtn" type="button">Bağla</button>
        <button class="btn btn-dark" id="confirmBtn" type="button">Təsdiqlə</button>
      </div>
    </div>
  </div>

  <script>
    const SLUG = 'kaya';
    const VISITOR_KEY = 'kaya_visitor_token_v1';

    let state = {
      name: 'KAYA',
      stampGoal: 5,
      rewardText: '10 MANAT BONUS',
      stampsCount: 0,
      rewardUnlocked: false,
      about: 'KAYA — dadlı yeməklər, isti atmosfer və daimi qonaqlarımız üçün bonus sistemi.',
      menu: [
        { name: 'Kaya Burger', desc: 'Xüsusi sous, tərəvəz, kartof fri', price: '11 AZN' },
        { name: 'Türk Qəhvəsi', desc: 'Qumda bişirilmiş qəhvə', price: '4.50 AZN' },
        { name: 'Limonad', desc: 'Nanə və limon ilə', price: '5 AZN' }
      ]
    };

    let mode = 'stamp'; // 'stamp' | 'redeem'

    function getVisitorToken() {
      let token = localStorage.getItem(VISITOR_KEY);
      if (!token) {
        token = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2));
        localStorage.setItem(VISITOR_KEY, token);
      }
      return token;
    }

    function renderMenu() {
      const list = document.getElementById('menuList');
      list.innerHTML = '';
      state.menu.forEach(item => {
        const row = document.createElement('div');
        row.className = 'menu-row';
        row.innerHTML = `
          <div>
            <div class="menu-name">${item.name || ''}</div>
            ${item.desc ? `<div class="menu-desc">${item.desc}</div>` : ''}
          </div>
          <div class="menu-price">${item.price || ''}</div>
        `;
        list.appendChild(row);
      });
    }

    function renderUI() {
      document.getElementById('restName').textContent = state.name;
      document.getElementById('bonusPill').textContent = state.rewardText;
      document.getElementById('aboutText').textContent = state.about;

      const circlesEl = document.getElementById('circles');
      circlesEl.innerHTML = '';
      for (let i = 1; i <= state.stampGoal; i++) {
        const div = document.createElement('div');
        const filled = i <= state.stampsCount;
        div.className = 'circle' + (filled ? ' done' : '');
        div.textContent = filled ? '✓' : i;
        circlesEl.appendChild(div);
      }

      const pill = document.getElementById('bonusPill');
      const hint = document.getElementById('hintText');
      const btn = document.getElementById('actionBtn');

      if (state.rewardUnlocked) {
        pill.classList.add('ready');
        hint.textContent = 'Bonus aktivdir! Kassirə göstərin və endirimi tətbiq edin.';
        btn.textContent = 'Bonusu işlət və sıfırla';
        btn.className = 'btn btn-green';
        btn.dataset.mode = 'redeem';
      } else {
        pill.classList.remove('ready');
        hint.textContent = `${state.stampsCount} / ${state.stampGoal} dairə dolub`;
        btn.textContent = 'Xal əlavə et';
        btn.className = 'btn btn-dark';
        btn.dataset.mode = 'stamp';
      }

      renderMenu();
    }

    async function loadCardFromBackend() {
      try {
        const token = encodeURIComponent(getVisitorToken());
        const res = await fetch(`/.netlify/functions/get-card?slug=${SLUG}&visitorToken=${token}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.restaurant) {
          state.name = data.restaurant.name || state.name;
          state.stampGoal = data.restaurant.stamp_goal || state.stampGoal;
          state.rewardText = data.restaurant.reward_text || state.rewardText;
          state.about = data.restaurant.about || state.about;
          if (Array.isArray(data.restaurant.menu_json) && data.restaurant.menu_json.length) {
            state.menu = data.restaurant.menu_json;
          }
        }
        if (data.card) {
          state.stampsCount = Number(data.card.stamps_count || 0);
          state.rewardUnlocked = Boolean(data.card.reward_unlocked);
        }
        renderUI();
      } catch (_) {
        // Hələ backend qoşulmayanda lokal görünüş qalır
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const isMenu = tab.dataset.tab === 'menu';
        document.getElementById('aboutBox').style.display = isMenu ? 'none' : 'block';
        document.getElementById('menuBox').style.display = isMenu ? 'block' : 'none';
      });
    });

    const modal = document.getElementById('pinModal');
    const pinInput = document.getElementById('pinInput');
    const modalMsg = document.getElementById('modalMsg');

    function openModal(nextMode) {
      mode = nextMode;
      pinInput.value = '';
      modalMsg.textContent = '';
      modalMsg.className = 'msg';
      document.getElementById('modalTitle').textContent =
        mode === 'redeem' ? 'Bonusu təsdiqlə' : 'Kassir PİN kodu';
      document.getElementById('modalSub').textContent =
        mode === 'redeem'
          ? `${state.rewardText} verildikdən sonra kassir PİN-ini yazın`
          : 'Xal əlavə etmək üçün kassir PİN-ini yazın';
      modal.classList.add('open');
      setTimeout(() => pinInput.focus(), 80);
    }

    function closeModal() {
      modal.classList.remove('open');
    }

    document.getElementById('actionBtn').addEventListener('click', (e) => {
      openModal(e.target.dataset.mode || 'stamp');
    });

    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.getElementById('confirmBtn').addEventListener('click', async () => {
      const pin = pinInput.value.trim();
      if (!pin) {
        modalMsg.textContent = 'PİN kodu yazın.';
        modalMsg.className = 'msg err';
        return;
      }

      const endpoint = mode === 'redeem'
        ? '/.netlify/functions/redeem-bonus'
        : '/.netlify/functions/add-stamp';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slug: SLUG,
            visitorToken: getVisitorToken(),
            pin
          })
        });
        const data = await res.json();
        if (!res.ok) {
          modalMsg.textContent = data.error || 'Xəta baş verdi.';
          modalMsg.className = 'msg err';
          return;
        }

        state.stampsCount = Number(data.stamps_count ?? state.stampsCount);
        state.rewardUnlocked = Boolean(data.reward_unlocked);
        renderUI();

        modalMsg.textContent = data.message || 'Hazırdır!';
        modalMsg.className = 'msg ok';
        setTimeout(closeModal, 700);
      } catch (_) {
        modalMsg.textContent = 'Serverə qoşulmaq olmadı.';
        modalMsg.className = 'msg err';
      }
    });

    renderUI();
    loadCardFromBackend();
  </script>
</body>
</html>
